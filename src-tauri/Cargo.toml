[package]
name = "cratify"
version = "0.1.2"
description = "Cratify: organise your Serato DJ library"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
lto = true
strip = "debuginfo"

# Build scripts and proc-macros are dylibs loaded by rustc; stripping their symbols on macOS
# breaks them ("can't find crate for `phf_macros`").
[profile.release.build-override]
strip = false
